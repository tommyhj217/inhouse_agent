# =====================================================================
# 사내 자료수집 에이전트 설정
#   1) 이 파일을 config/config.yaml 로 복사
#   2) .env.example 을 .env 로 복사 후 Azure 정보 입력
#   3) mcp_servers 에 기존에 만들어 둔 MCP 서버들을 등록
#   ${변수} / ${변수:-기본값} 은 환경변수(.env)로 치환됩니다.
# =====================================================================

llm:
  # provider: none                                # LLM(토큰) 없이 쓰기: 채팅창 / 명령으로 스킬 워크플로·도구만 실행 (사내 테스트용)
  # --- Azure OpenAI ---
  endpoint: ${AZURE_OPENAI_ENDPOINT}
  base_url: ${AZURE_OPENAI_BASE_URL:-}          # APIM 게이트웨이 사용 시에만
  deployment: ${AZURE_OPENAI_DEPLOYMENT}         # Azure 에 배포한 모델의 "배포 이름"
  api_version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
  auth: api_key                                   # api_key | entra_id(azure-identity 필요)
  api_key: ${AZURE_OPENAI_API_KEY}

  # 최신(추론형) 모델은 max_completion_tokens 를 사용하고 temperature 를 지원하지 않습니다.
  # 구형 모델/구형 api_version 이면 max_tokens_param: max_tokens 로 바꾸세요.
  max_output_tokens: 8192
  max_tokens_param: max_completion_tokens
  temperature:                                    # 비우면 전송 안 함
  reasoning_effort:                               # low | medium | high (추론 모델만, 비우면 전송 안 함)
  timeout: 180
  max_retries: 3
  vision: true                                    # 배포 모델이 이미지 입력을 지원하는지 (채팅 이미지 첨부). 미지원이면 false
  prompt_cache_key: true                          # 대화마다 캐시 키를 보내 프롬프트 캐시 적중률을 높임 (배포가 모르면 자동으로 끔)
  extra_headers:
    # Ocp-Apim-Subscription-Key: ${APIM_SUBSCRIPTION_KEY:-}

  # --- 여러 모델을 비용 기준으로 골라 쓰기 (배포가 2개 이상일 때) ---
  #   요청마다 난이도에 맞는 가장 싼 모델로 시작 → 막히면 한 단계 위 모델로 → 모델이 응답하지 못하면 다른 모델로
  #   cost_in / cost_out / cost_cached: 100만 토큰당 입력 / 출력 / 캐시된 입력 가격 (단위는 routing.currency).
  #     사용 이력에 비용·절약액·캐시 비율이 나옵니다. cost_cached 를 비우면 할인 없이 cost_in 으로 계산합니다.
  #     아래 값은 Azure 공개 단가 (pi 모델 목록, 2026-11 기준: gpt-6.1-sol / gpt-6.1-terra / gpt-6-luna). 계약 단가가 다르면 바꾸세요.
  #   context_window: Azure 배포는 105만 토큰까지 받지만 입력이 27.2만 토큰을 넘으면 장문 단가가 붙으므로 272000 권장
  # models:
  #   - {name: sol,   deployment: sol,   tier: high, cost_in: 2.0, cost_out: 10.0, cost_cached: 0.1,  context_window: 272000, description: 어려운 분석·보고서}
  #   - {name: terra, deployment: terra, tier: mid,  cost_in: 1.0, cost_out: 5.0,  cost_cached: 0.05, context_window: 272000, description: 일반 업무}
  #   - {name: luna,  deployment: luna,  tier: low,  cost_in: 0.1, cost_out: 0.5,  cost_cached: 0.01, context_window: 272000, description: 조회·요약}
  #   # 이미지 입력을 못 받는 배포면 vision: false 를 붙이세요.
  #   # 모델마다 endpoint / api_key / api_version / max_output_tokens / reasoning_effort 를 따로 줄 수도 있습니다.
  # routing:
  #   mode: auto                  # auto(비용 기준 자동) | fixed(항상 위의 deployment)
  #   classifier: rules           # rules(규칙, 비용 0) | llm(가장 싼 모델에게 난이도를 물어봄)
  #   escalate: true              # 도구 오류 연속·같은 호출 되풀이·진전 없음·빈 답변이면 한 단계 위 모델로
  #   summary_model: luna         # 대화 압축 요약에 쓸 모델 (기본: 가장 싼 모델)
  #   subagent_max_tier: mid      # 하위 에이전트는 이 등급 이하에서 시작
  #   currency: "$"               # 비용 표시 단위

agent:
  timezone: Asia/Seoul
  max_iterations: 30            # 1회 요청의 기본 반복 예산 (LLM↔도구 왕복). 진전이 있으면 자동으로 늘어남
  max_iterations_cap: 100       # 자동으로 늘어날 수 있는 상한
  extend_iterations: 10         # 한 번에 늘리는 횟수 (최근 3번 안에 새 도구 호출이 성공했을 때만)
  max_minutes: 30               # 한 요청의 최대 실행 시간(분). 넘으면 중간 결과로 정리
  loop_threshold: 3             # 같은 도구를 같은 인자로 이만큼 부르면 '되풀이' 로 보고 멈춤 (기다리기·상태 확인 도구는 제외)
  max_tool_error_streak: 3      # 도구가 모두 실패한 차례가 이만큼 이어지면 멈춤
  max_tool_result_chars: 30000  # tool 결과가 길면 잘라서 LLM 에 전달
  max_history_messages: 200     # 대화 메시지가 이보다 많아지면 앞부분을 요약 (지우지 않음)
  context_window: 128000        # 배포 모델의 입력 한도(토큰). 모델에 맞게 (예: 272000, 400000)
  compact_at: 0.75              # 대화가 한도의 75% 를 넘으면 자동 압축: 오래된 도구 결과 줄이기 → 앞 대화 요약
  subagents: true               # run_subagent: 여러 파일·사이트를 하위 에이전트에게 나눠 맡김 (LLM 있을 때)
  subagent_max_iterations: 12   # 하위 에이전트 1개의 최대 도구 왕복 횟수
  parallel_tool_calls: true     # 서로 다른 서버는 병렬, 같은 서버는 자동으로 순차 실행
  output_dir: outputs
  log_dir: logs
  # system_prompt: |            # 비우면 기본 프롬프트 사용 (src/inhouse_agent/agent.py)
  #   ...

# ---------------------------------------------------------------------
# 파일 (MCP 로 내려받은 파일 감지 / 상태 점검 / 분석)
#   - workspace/downloads, uploads, files 폴더가 자동 생성됩니다.
#   - stdio MCP 서버에는 AGENT_DOWNLOAD_DIR(=workspace/downloads) 환경변수가 전달됩니다.
#     웹컨트롤 MCP 의 브라우저 다운로드 경로를 이 값으로 맞추면 가장 정확합니다.
#   - 브라우저 기본 다운로드 폴더를 그대로 쓰면 watch_dirs 에 추가하세요.
# ---------------------------------------------------------------------
files:
  workspace: workspace
  watch_dirs: []
    # - C:/Users/<사용자>/Downloads
  extra_read_dirs: []          # 분석(읽기)만 허용할 추가 폴더
  max_file_mb: 200
  auto_detect: true            # MCP tool 호출 전후 다운로드 폴더를 비교해 새 파일 자동 점검
  wait_timeout: 300            # wait_for_download 기본 대기 시간(초)

# ---------------------------------------------------------------------
# 규칙집: 과거 자료(PPT/엑셀)로 장별 구성·규칙을 배우고, 새 자료를 검증하며 스스로 갱신
#   rulebooks/<이름>/ 에 저장 (모든 사용자가 공유 → 지식이 쌓임). GitHub 에 커밋해 서버 간 공유 가능.
#   지지율 기준 등은 각 규칙집의 settings 에서 조정 (promote 0.75 / demote 0.5 / min_docs 2)
# ---------------------------------------------------------------------
rules:
  dir: rulebooks

# ---------------------------------------------------------------------
# 영업일 (business_days 도구, {prev_business_day} 같은 날짜 변수, 예약작업 영업일 조건)
#   한국 공휴일·대체공휴일은 자동 반영 (holidays 패키지). 회사 휴무일·대체근무일만 적으세요.
# ---------------------------------------------------------------------
calendar:
  holidays: []                  # 예) ["2026-11-20 창립기념일", "2026-12-31 종무일"]
  workdays: []                  # 휴일이지만 근무하는 날 예) ["2026-10-10"]
  # weekend: [5, 6]             # 주말 요일 (월=0 … 일=6)

# ---------------------------------------------------------------------
# 사내 문서 도구
# ---------------------------------------------------------------------
office:
  # soffice: "C:/Program Files/LibreOffice/program/soffice.exe"   # render_preview (PPT·엑셀 → 장 이미지). 비우면 자동으로 찾음

# ---------------------------------------------------------------------
# 사용자별 작업폴더 (workspace/users/<ID>/ : downloads, uploads, files, results, sessions, memory.json)
#   웹 화면 오른쪽 위에서 ID 입력, CLI 는 -u <ID>. 대화는 sessions/ 에 저장되어 '내 작업' 에서 이어서 진행.
#   ※ 별도 인증(API 토큰·비밀번호) 없이 접속하면 바로 쓰고, 웹 화면은 처음 접속할 때 ID 를 물어봅니다(사내 식별용).
#     허용할 ID 를 제한하려면 users.allowed 를 쓰세요.
# ---------------------------------------------------------------------
users:
  enabled: true
  require: false                # true 면 ID 없는 API 호출(스크립트 등)도 거부. 웹 화면은 항상 ID 를 먼저 물어봄
  allowed: []                   # 허용 ID 패턴 (비우면 모두). 예: ["2023*", "*.hj"]
  claim_downloads: move         # 공용 다운로드 폴더(MCP 저장 위치)에 생긴 파일을 요청한 사용자 폴더로: move | copy | none
  recent_sessions_in_prompt: 5  # 시스템 프롬프트에 넣을 '최근 작업' 개수

# ---------------------------------------------------------------------
# 웹 서버 / 파일 링크
#   public_url: 다른 사람이 접속하는 주소. 설정하면 메일·메신저·웹훅·CLI 에 절대 다운로드 링크가 붙습니다.
#   링크(/d/...)는 서명되어 위조할 수 없고 기한이 지나면 열리지 않습니다 (API 토큰 없이 열림).
#   서명 키는 workspace/.link_secret 에 자동 생성 (여러 서버가 같은 키를 쓰려면 AGENT_LINK_SECRET 환경변수).
# ---------------------------------------------------------------------
server:
  public_url: ""                # 예: http://agent.company.com:8080
  link_expire_hours: 168        # 공유 링크 유효 시간 (기본 7일)

# ---------------------------------------------------------------------
# 범용 도구 (docs/agent_tools_analysis.md 참고)
# ---------------------------------------------------------------------
web_search:                     # 비우면 web_search tool 없음
  provider: ""                  # searxng (사내 설치형 검색) | tavily
  url: ""                       # searxng: http://searxng.company.com
  api_key: ""                   # tavily 만
http:
  allow_unattended_write: false # 예약작업에서 http_request 의 POST/PUT/DELETE 허용 여부 (대화형은 매번 승인)
notify:
  allow_unattended: true        # 예약작업에서 send_email/send_message 허용 (수신자/채널 제한은 항상 적용)
  email:                        # smtp_host 를 넣으면 send_email tool 활성화
    smtp_host: ""
    port: 25
    starttls: false
    ssl: false
    username: ""
    password: ${SMTP_PASSWORD:-}
    from: "agent@company.com"
    allowed_recipients: []      # 필수. 예: ["*@company.com"]
    max_attach_mb: 20           # 넘으면 첨부 대신 본문 다운로드 링크
  webhooks: {}                  # 채널이름: 웹훅URL → send_message tool 활성화
    # 영업팀: ${TEAMS_SALES_WEBHOOK:-}

# ---------------------------------------------------------------------
# 다운로드 URL (MCP 가 파일 대신 링크를 줄 때 download_url tool 로 받기)
#   사내 프록시는 HTTP(S)_PROXY / NO_PROXY 환경변수를 그대로 씁니다.
# ---------------------------------------------------------------------
downloads:
  allowed_hosts: ["*"]          # 받을 수 있는 호스트 패턴. 운영에서는 사내 도메인으로 제한 권장: ["*.company.com", "10.*"]
  blocked_hosts: []
  verify: true                  # true | false | 사내 CA 인증서 경로 (예: C:/certs/company-ca.pem)
  timeout: 120
  max_mb: 500
  retries: 2
  auto_download: false          # true 면 MCP 결과의 다운로드 링크를 자동으로 받아 상태 점검
  sites: []                     # 사이트별 고정 헤더/쿠키 (토큰은 .env 로)
  #  - match: "erp.company.com"
  #    headers: { Authorization: "Bearer ${ERP_TOKEN:-}" }
  #  - match: "*.groupware.company.com"
  #    cookies: { JSESSIONID: "${GW_SESSION:-}" }

# ---------------------------------------------------------------------
# 동적 도구: 필요한 tool 이 없으면 에이전트가 파이썬 코드로 tool 을 만들어 바로 실행
#   mode: off(사용 안 함) | approve(만들거나 코드 실행 전 사용자 승인) | auto(자동)
#   - 별도 파이썬 프로세스에서 실행(제한시간, 최소 환경변수, 작업폴더=workspace)
#   - subprocess/eval/파일삭제 등 위험한 호출은 정적 검사로 차단 (완전한 보안 샌드박스는 아님)
#   - 만든 도구는 tools/<이름>.py 로 저장 → 다음 실행/예약작업에서도 custom__<이름> 으로 사용
# ---------------------------------------------------------------------
dynamic_tools:
  mode: approve
  dir: tools
  timeout: 120
  allow_tool_calls: true        # 도구 코드에서 ctx.call_tool() 로 MCP tool 호출 허용
  env_passthrough: []           # 도구 코드에 넘겨줄 환경변수 이름 (예: [ERP_API_TOKEN])
  # blocked_modules: [subprocess, ctypes, multiprocessing, winreg, pty, pickle, marshal]
  # blocked_calls: [os.system, os.popen, os.remove, shutil.rmtree, eval, exec, ...]

# ---------------------------------------------------------------------
# 스킬: skills/<이름>/SKILL.md (웹 화면 '스킬' 탭에서 편집/테스트)
# ---------------------------------------------------------------------
skills:
  dir: skills                   # 모든 사용자가 같이 쓰는 스킬 폴더 (누가 추가해도 / 목록에 바로 보임)
  editors: []                   # 스킬·동적 도구를 만들고 고칠 수 있는 사용자 ID 패턴 (비우면 모두). 예: ["kim.hj", "admin*"]
                                #  → 그 외 사용자는 보기·실행만 가능
  scripts: on                   # 스킬 폴더 스크립트(scripts/*.py 등) 실행: on | approve(실행 전 승인) | off
  script_timeout: 300           # 스크립트 최대 실행 초
  # script_env:                 # 스크립트에 넘길 환경변수 ({user} {skills_dir} {skill_dir} {data_dir} {workspace} {output_dir})
  #   MODEL_AGENTS_USER: "{user}"            # (기본값) model-agents 스킬: 사용자별 모델/이력
  #   MODEL_AGENTS_SKILL_ROOTS: "{skills_dir}"
  # git_token: ${AGENT_GIT_TOKEN:-}         # 비공개 GitHub/사내 Git 저장소에서 스킬 가져오기 (공개 저장소는 불필요)
  # git_tokens: {github.company.com: "${GHE_TOKEN:-}"}

# ---------------------------------------------------------------------
# MCP 서버 (기존에 만들어 둔 사이트별 웹컨트롤 MCP)
#   transport: stdio  → command/args 로 프로세스를 직접 띄움
#   transport: http   → 이미 떠 있는 Streamable HTTP MCP 서버 (url)
#   transport: sse    → 구형 SSE MCP 서버 (url)
#   description 은 LLM 이 어느 사이트를 쓸지 판단하는 데 쓰이므로 구체적으로 적으세요.
# ---------------------------------------------------------------------
mcp_servers:
  demo:
    description: "데모용 샘플 서버 (공지사항/매출 가짜 데이터)"
    transport: stdio
    command: python
    args: ["examples/sample_mcp_server.py"]
    enabled: true

  # groupware:
  #   description: "그룹웨어 - 공지사항, 결재 문서, 일정 조회"
  #   transport: stdio
  #   command: python
  #   args: ["C:/mcp/groupware_mcp/server.py"]
  #   cwd: "C:/mcp/groupware_mcp"
  #   env:
  #     GW_USER: ${GW_USER}
  #     GW_PASSWORD: ${GW_PASSWORD}
  #   connect_timeout: 90       # 브라우저 기동이 느리면 늘리세요
  #   tool_timeout: 300         # tool 1회 호출 제한 시간(초)
  #   retry_on_failure: true    # 호출 중 서버가 죽으면 재시작 후 1회 재시도
  #   include_tools: []         # 노출할 tool 이름 패턴 (비우면 전체) 예: ["get_*", "search_*"]
  #   exclude_tools: []         # 숨길 tool 이름 패턴 예: ["delete_*"]

  # erp:
  #   description: "ERP - 매출/재고/발주 현황"
  #   transport: http
  #   url: http://127.0.0.1:8001/mcp
  #   headers:
  #     Authorization: Bearer ${ERP_MCP_TOKEN}

  # ---- 다른 PC 에서 도는 원격 MCP (파일이 그 PC 디스크에 저장되는 경우) ----
  # groupware_remote:
  #   description: "그룹웨어 (10.0.0.5 PC 의 웹컨트롤 MCP)"
  #   transport: http
  #   url: http://10.0.0.5:8001/mcp
  #   remote: auto               # auto(URL 호스트로 판단) | true | false
  #   remote_files:
  #     # 원격 경로 접두어 → 에이전트 PC 에서 보이는 공유폴더 또는 URL (가장 긴 접두어 우선)
  #     path_map:
  #       "C:/mcp/downloads": "//fileserver/mcp_downloads"     # SMB 공유폴더 (다운로드 감시 폴더에 자동 추가)
  #       "D:/exports": "http://10.0.0.5:9000/exports"          # 원격 PC 가 파일을 HTTP 로 제공하는 경우
  #     fetch_tool: read_server_file   # 원격 MCP 에 '파일 내용을 돌려주는 tool' 이 있으면 (blob 또는 base64)
  #     fetch_arg: path                # 그 tool 의 경로 인자 이름
  #     use_resources: true            # MCP resources/read (file:///경로) 시도
  #     rewrite_localhost: true        # 결과의 http://localhost:포트 링크를 MCP 서버 주소로 변환
  #     auto_fetch: true               # 결과에 원격 경로가 나오면 자동으로 가져오기

# ---------------------------------------------------------------------
# 예약작업
#   cron: "분 시 일 월 요일"  (요일: 0=일 ... 6=토, 또는 mon-fri)
#   prompt 에서 사용 가능한 변수:
#     {today} {yesterday} {tomorrow} {now} {weekday}
#     {this_month} {last_month} {week_start} {week_end} {last_week_start} {last_week_end}
#   servers: 이 작업에서 사용할 MCP 서버 제한 (생략 시 전체)
#   skill / inputs: 스킬로 실행 (예약작업에서는 ask_user 질문 없이 기본값으로 진행)
#   결과: outputs/<name>/<시각>.md (+ latest.md, _trace/ 상세 기록)
# ---------------------------------------------------------------------
schedules:
  - name: daily_notice
    description: "매일 아침 전날 공지사항 요약"
    cron: "30 8 * * mon-fri"
    business_days_only: true       # 공휴일·회사 휴무일에는 건너뜀
    servers: [demo]
    enabled: true
    output_format: md            # md | txt | json
    # webhook_url: ${TEAMS_WEBHOOK_URL:-}   # 결과를 Teams/Slack 웹훅으로 전송
    prompt: |
      {prev_business_day} 에 등록된 공지사항을 모두 가져와서
      제목/작성부서/핵심 내용 표로 정리하고, 업무에 영향이 큰 항목을 맨 위에 요약해줘.
      정리한 표는 save_file 로 notices/{prev_business_day}.md 에 저장해줘.

  - name: monthly_sales
    description: "매월 1일 지난달 매출 보고서 (스킬 사용)"
    cron: "10 9 1 * *"
    skill: monthly_sales_report      # 스킬로 실행 (prompt 생략 가능)
    # user: kim.hj                   # 이 사용자의 작업폴더에서 실행 (결과: workspace/users/kim.hj/results/)
    inputs:
      month: "{last_month}"
      dept: 전체
    enabled: false

  - name: weekly_sales
    description: "매주 월요일 지난주 매출 집계"
    cron: "0 9 * * mon"
    servers: [demo]
    enabled: false
    prompt: |
      {last_week_start} ~ {last_week_end} 기간의 일별 매출을 가져와서
      합계와 전주 대비 특이사항을 정리하고 CSV 로 sales/{last_week_start}.csv 에 저장해줘.
