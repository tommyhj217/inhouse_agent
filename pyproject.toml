[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inhouse-agent"
version = "0.1.0"
description = "사내 사이트 MCP(웹 컨트롤) tool 을 Azure OpenAI 로 오케스트레이션하는 자료수집 에이전트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.54",
    "mcp>=1.9",
    "apscheduler>=3.10,<4",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "pypdf>=4",
    "xlrd>=2.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
entra = ["azure-identity>=1.15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
inhouse-agent = "inhouse_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inhouse_agent = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
